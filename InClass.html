<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="In Class?">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14110F">
<title>In Class?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg: #14110F;
  --card: #1E1A16;
  --card-hi: #262019;
  --line: #35302A;
  --orange: #FF6A13;
  --orange-dim: #6B3915;
  --green: #4FAE7E;
  --green-dim: #204633;
  --text: #F2EDE6;
  --muted: #A89F93;
  --mono: 'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(ellipse at top, #1c1712 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'IBM Plex Sans',sans-serif;
  min-height:100vh;
  padding:calc(28px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  -webkit-tap-highlight-color: transparent;
}
.wrap{max-width:720px;margin:0 auto;}

.eyebrow{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
  text-align:center;
  margin-bottom:6px;
}
h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  text-align:center;
  font-size:22px;
  margin:0 0 26px;
  color:var(--text);
}

/* Scoreboard */
.board{
  background: linear-gradient(180deg,var(--card-hi),var(--card));
  border:1px solid var(--line);
  border-radius:6px;
  padding:34px 24px;
  text-align:center;
  position:relative;
  overflow:hidden;
  box-shadow: 0 20px 50px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.03);
}
.board::before{
  content:"";
  position:absolute; inset:0;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 3px);
  pointer-events:none;
}
.status-label{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:14px;
}
.status-readout{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:clamp(40px,10vw,64px);
  line-height:1;
  letter-spacing:.02em;
  text-transform:uppercase;
  transition:color .3s ease, text-shadow .3s ease;
}
.status-readout.in-class{
  color:var(--orange);
  text-shadow:0 0 28px rgba(255,106,19,.45);
}
.status-readout.free{
  color:var(--green);
  text-shadow:0 0 28px rgba(79,174,126,.4);
}
.status-detail{
  margin-top:16px;
  font-family:var(--mono);
  font-size:15px;
  color:var(--text);
  min-height:20px;
}
.status-sub{
  margin-top:6px;
  font-family:var(--mono);
  font-size:12px;
  color:var(--muted);
}
.clock{
  margin-top:22px;
  padding-top:18px;
  border-top:1px dashed var(--line);
  font-family:var(--mono);
  font-size:13px;
  color:var(--muted);
  letter-spacing:.05em;
}

/* Schedule section */
.section-title{
  font-family:'Oswald',sans-serif;
  text-transform:uppercase;
  letter-spacing:.06em;
  font-size:14px;
  color:var(--muted);
  margin:38px 0 14px;
  display:flex;
  align-items:center;
  gap:10px;
}
.section-title::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--line);
}

.class-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:18px;
}
.class-row{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:5px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.class-row .cname{
  font-weight:600;
  font-size:14px;
}
.class-row .cmeta{
  font-family:var(--mono);
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}
.class-row .cright{flex:1;}
.del-btn{
  background:none;
  border:1px solid var(--line);
  color:var(--muted);
  width:28px;height:28px;
  border-radius:4px;
  cursor:pointer;
  font-size:15px;
  line-height:1;
  flex-shrink:0;
}
.del-btn:hover{border-color:var(--orange);color:var(--orange);}

.empty-note{
  font-family:var(--mono);
  font-size:13px;
  color:var(--muted);
  padding:16px;
  text-align:center;
  border:1px dashed var(--line);
  border-radius:5px;
}

@media(min-width:520px){}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Weekly schedule status</div>
  <h1>Am I in class?</h1>

  <div class="board">
    <div class="status-label">Right now</div>
    <div id="statusReadout" class="status-readout free">—</div>
    <div id="statusDetail" class="status-detail"></div>
    <div id="statusSub" class="status-sub"></div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="section-title">Your classes</div>
  <div id="classList" class="class-list"></div>
</div>

<script>
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DEFAULT_CLASSES = [
  { id:'d1', name:'Philosophies', start:'12:30', end:'13:20', days:['Mon','Wed','Fri'] },
  { id:'d2', name:'Finance', start:'14:30', end:'15:45', days:['Mon','Wed'] },
  { id:'d3', name:'Cybersecurity', start:'10:30', end:'11:45', days:['Tue','Thu'] },
  { id:'d4', name:'Web Application', start:'13:30', end:'14:45', days:['Tue','Thu'] },
  { id:'d5', name:'Descriptive Analytics', start:'15:00', end:'16:15', days:['Tue','Thu'] },
  { id:'d6', name:'Professional Development', start:'08:30', end:'09:30', days:['Mon','Wed'], startDate:'2026-10-12' }
];
let classes = [];

function timeToMinutes(t){
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}
function fmtTime(t){
  const [h,m] = t.split(':').map(Number);
  const ampm = h>=12?'PM':'AM';
  let hh = h%12; if(hh===0) hh=12;
  return hh+':'+String(m).padStart(2,'0')+' '+ampm;
}

const LOCAL_KEY = 'inclass_schedule_v1';
// window.storage only works while this page is viewed inside Claude.
// When added to your phone's home screen it runs standalone, so we
// fall back to the browser's own local storage in that case.
const hasClaudeStorage = () => (typeof window !== 'undefined' && !!window.storage);

async function loadClasses(){
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get('classes');
      classes = res ? JSON.parse(res.value) : null;
      if(classes === null){
        classes = DEFAULT_CLASSES.map(c=>({...c}));
        await saveClasses();
      }
      renderList();
      renderStatus();
      return;
    }catch(e){
      // fall through to local storage
    }
  }
  try{
    const raw = window.localStorage.getItem(LOCAL_KEY);
    classes = raw ? JSON.parse(raw) : null;
    if(classes === null){
      classes = DEFAULT_CLASSES.map(c=>({...c}));
      await saveClasses();
    }
  }catch(e){
    classes = DEFAULT_CLASSES.map(c=>({...c}));
  }
  renderList();
  renderStatus();
}

async function saveClasses(){
  if(hasClaudeStorage()){
    try{
      await window.storage.set('classes', JSON.stringify(classes));
      return;
    }catch(e){
      // fall through to local storage
    }
  }
  try{
    window.localStorage.setItem(LOCAL_KEY, JSON.stringify(classes));
  }catch(e){
    console.error('save failed', e);
  }
}

function renderList(){
  const listEl = document.getElementById('classList');
  if(classes.length===0){
    listEl.innerHTML = '<div class="empty-note">No classes added yet. Add your first one below.</div>';
    return;
  }
  const order = {Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:7};
  const sorted = [...classes].sort((a,b)=> timeToMinutes(a.start)-timeToMinutes(b.start));
  listEl.innerHTML = '';
  sorted.forEach(c=>{
    const row = document.createElement('div');
    row.className = 'class-row';
    const daysStr = c.days.slice().sort((a,b)=>order[a]-order[b]).join(' ');
    const startNote = c.startDate ? ' · starts ' + new Date(c.startDate+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
    row.innerHTML = `
      <div class="cright">
        <div class="cname">${escapeHtml(c.name)}</div>
        <div class="cmeta">${daysStr} · ${fmtTime(c.start)} – ${fmtTime(c.end)}${startNote}</div>
      </div>
      <button class="del-btn" data-id="${c.id}" aria-label="Delete class">×</button>
    `;
    listEl.appendChild(row);
  });
  listEl.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      classes = classes.filter(c=>c.id !== btn.dataset.id);
      await saveClasses();
      renderList();
      renderStatus();
    });
  });
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function dateOnly(d){
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function isActiveOn(c, dateObj){
  if(!c.startDate) return true;
  const start = new Date(c.startDate + 'T00:00:00');
  return dateOnly(dateObj) >= dateOnly(start);
}

function renderStatus(){
  const now = new Date();
  const day = DAYS[now.getDay()];
  const nowMin = now.getHours()*60+now.getMinutes();

  const readout = document.getElementById('statusReadout');
  const detail = document.getElementById('statusDetail');
  const sub = document.getElementById('statusSub');

  // find current class
  const current = classes.find(c => c.days.includes(day) && isActiveOn(c, now) && nowMin >= timeToMinutes(c.start) && nowMin < timeToMinutes(c.end));

  if(current){
    readout.textContent = 'In class';
    readout.className = 'status-readout in-class';
    detail.textContent = current.name;
    const minsLeft = timeToMinutes(current.end) - nowMin;
    sub.textContent = 'Ends at ' + fmtTime(current.end) + ' · ' + minsLeft + ' min left';
  } else {
    readout.textContent = 'Free';
    readout.className = 'status-readout free';
    // find next class today or in coming days
    const next = findNextClass(now, nowMin);
    if(next){
      detail.textContent = 'Next: ' + next.cls.name;
      sub.textContent = next.when;
    } else {
      detail.textContent = classes.length ? 'No more classes on the schedule' : 'Add your classes below';
      sub.textContent = '';
    }
  }
}

function findNextClass(now, nowMin){
  const order = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  const today = DAYS[now.getDay()];
  const todayIdx = order[today];

  // today, later
  const todays = classes
    .filter(c=>c.days.includes(today) && isActiveOn(c, now) && timeToMinutes(c.start) > nowMin)
    .sort((a,b)=>timeToMinutes(a.start)-timeToMinutes(b.start));
  if(todays.length){
    return { cls: todays[0], when: 'Today at ' + fmtTime(todays[0].start) };
  }

  // upcoming days, up to 7 ahead
  for(let i=1;i<=7;i++){
    const futureDate = new Date(now);
    futureDate.setDate(now.getDate()+i);
    const dName = DAYS[futureDate.getDay()];
    const matches = classes
      .filter(c=>c.days.includes(dName) && isActiveOn(c, futureDate))
      .sort((a,b)=>timeToMinutes(a.start)-timeToMinutes(b.start));
    if(matches.length){
      const label = i===1 ? 'Tomorrow' : dName;
      return { cls: matches[0], when: label + ' at ' + fmtTime(matches[0].start) };
    }
  }
  return null;
}

function updateClock(){
  const now = new Date();
  const opts = { weekday:'short', hour:'2-digit', minute:'2-digit' };
  document.getElementById('clock').textContent = now.toLocaleString('en-US', opts);
}

loadClasses();
updateClock();
setInterval(()=>{ updateClock(); renderStatus(); }, 15000);
</script>
</body>
</html>
